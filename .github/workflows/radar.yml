name: Radar Climatico
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escanear y avisar
        env:
          RADAR_TG_TOKEN: ${{ secrets.RADAR_TG_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python radar_bot.py --once
      - name: Guardar estado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado/
          if ! git diff --cached --quiet; then
            git commit -m "estado radar"
            git pull --rebase
            git push
          fi
